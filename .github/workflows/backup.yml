# Резервная копия базы Supabase — каждую ночь, бесплатно (на тарифе Free своих копий у Supabase нет).
# Копия шифруется паролем BACKUP_PASSPHRASE и хранится 30 дней во вкладке Actions → этот запуск → Artifacts.
# Репозиторий публичный, поэтому без шифрования выкладывать копию нельзя: в базе личные данные учеников.
# Как настроить и как восстановить — BACKUP.md.
name: Резервная копия базы

on:
  schedule:
    - cron: '30 1 * * *' # каждый день в 01:30 UTC (03:30 по Риге зимой)
  workflow_dispatch: # кнопка «Run workflow» — сделать копию прямо сейчас

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Общая база клуба и крепости (проект dtt-club). Обязательна.
          - name: club
            url_secret: SUPABASE_DB_URL
            required: true
          # База подворья (проект podvorye). Если секрет не заведён — пропускаем.
          - name: podvorye
            url_secret: PODVORYE_DB_URL
            required: false
    env:
      DB_URL: ${{ secrets[matrix.url_secret] }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Проверить настройки
        id: check
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Нет секрета BACKUP_PASSPHRASE — без него копию не зашифровать. См. BACKUP.md"; exit 1
          fi
          if [ -z "$DB_URL" ]; then
            if [ "${{ matrix.required }}" = "true" ]; then
              echo "::error::Нет секрета ${{ matrix.url_secret }} — адрес базы для копии. См. BACKUP.md"; exit 1
            fi
            echo "Секрета ${{ matrix.url_secret }} нет — копию «${{ matrix.name }}» пропускаем."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: 3.0.0 # точная версия: «latest» упирается в лимит запросов GitHub

      - name: Выгрузить базу
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p dump
          # С серверов GitHub прямой адрес db.<проект>.supabase.co недоступен (он только IPv6).
          # Если в секрете прямой адрес — сами переделываем его в адрес Session pooler (IPv4).
          candidates=$(python3 - <<'PY'
          import os, re
          url = os.environ['DB_URL'].strip()
          # Разбираем вручную: в пароле бывают «[ ]» и другие знаки, на которых стандартный разбор падает.
          m = re.fullmatch(r'postgres(?:ql)?://([^:/@]+):(.*)@([^@/:]+)(?::(\d+))?(/.*)?', url)
          host = m.group(3) if m else ''
          d = re.fullmatch(r'db\.([a-z0-9]+)\.supabase\.co', host)
          if not d:
              print(url)
          else:
              ref, pw = d.group(1), m.group(2)
              # В Supabase образец выглядит как [YOUR-PASSWORD]; скобки часто остаются — пробуем и без них.
              pws = [pw[1:-1], pw] if pw.startswith('[') and pw.endswith(']') else [pw]
              for p in pws:
                  for n in (0, 1):
                      for region in ('eu-west-1', 'eu-north-1', 'eu-central-1'):
                          print(f"postgresql://postgres.{ref}:{p}@aws-{n}-{region}.pooler.supabase.com:5432/postgres")
          PY
          )
          ok=""
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            echo "::add-mask::$c"
            if supabase db dump --db-url "$c" -f dump/roles.sql --role-only >/dev/null 2>dump/err.txt; then ok="$c"; break; fi
          done <<< "$candidates"
          if [ -z "$ok" ]; then
            echo "::error::Не удалось подключиться к базе. Проверьте секрет ${{ matrix.url_secret }} (адрес Session pooler и пароль)."
            grep -v -i "postgres" dump/err.txt | tail -5 || true
            exit 1
          fi
          DB_URL="$ok"; rm -f dump/err.txt
          supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$DB_URL" -f dump/data.sql --data-only --use-copy
          # Пустая выгрузка — тоже ошибка: иначе «копия» была бы без данных.
          test -s dump/schema.sql && test -s dump/data.sql
          ls -la dump

      - name: Зашифровать
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          name="${{ matrix.name }}-$(date -u +%Y-%m-%d)"
          echo "NAME=$name" >> "$GITHUB_ENV"
          tar czf "$name.tar.gz" -C dump .
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf dump "$name.tar.gz" # незашифрованное не оставляем
          ls -la "$name.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
